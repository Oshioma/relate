name: Deploy Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      # A fix to this job re-runs it, so migrations a broken run missed go in.
      - ".github/workflows/deploy-supabase-migrations.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Load project ref
        id: project
        run: |
          set -a
          source supabase/.env.local
          set +a
          echo "ref=$SUPABASE_PROJECT_REF" >> "$GITHUB_OUTPUT"

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ steps.project.outputs.ref }}"

      - name: Push database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # Newer Supabase CLIs push to a local stack unless told otherwise, and
        # ask for confirmation before touching production, which CI can't give.
        run: supabase db push --remote --yes
