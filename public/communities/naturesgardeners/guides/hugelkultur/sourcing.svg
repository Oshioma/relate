<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img"><title>Four places to source logs: arborists, hardwood workshops, firewood suppliers and your own garden</title><rect width="900" height="520" rx="0" fill="#faf9f5"/><text x="450" y="56" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#262622" text-anchor="middle" >Where to find logs</text><rect x="30" y="90" width="410" height="190" rx="20" fill="#ffffff" stroke="#e7e3d8" stroke-width="2"/><circle cx="90" cy="152" r="34" fill="#e7ede7"/><text x="90" y="164" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#4d6a52" text-anchor="middle" >1</text><text x="140" y="146.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#262622" text-anchor="start" >Arborists &amp; tree surgeons</text><text x="140" y="180" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#262622" text-anchor="start" >Often glad to drop a load</text><text x="60" y="240" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6b685f" text-anchor="start" >Presenter's source for 15+ beds</text><rect x="460" y="90" width="410" height="190" rx="20" fill="#ffffff" stroke="#e7e3d8" stroke-width="2"/><circle cx="520" cy="152" r="34" fill="#e7ede7"/><text x="520" y="164" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#4d6a52" text-anchor="middle" >2</text><text x="570" y="146.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#262622" text-anchor="start" >Hardwood workshops</text><text x="570" y="180" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#262622" text-