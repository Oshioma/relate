<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img"><title>Woods to avoid: black walnut, butternut and pecan for juglone; cedar, redwood and black locust because they resist decay</title><rect width="900" height="700" rx="0" fill="#faf9f5"/><text x="450" y="56" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#262622" text-anchor="middle" >Woods the video says to avoid</text><text x="450" y="92" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#6b685f" text-anchor="middle" >Two different problems. Neither group is simply 'poisonous'.</text><rect x="30" y="120" width="410" height="550" rx="20" fill="#f7ecd6" stroke="#e6cf9f" stroke-width="2"/><text x="235" y="166" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#b7832f" text-anchor="middle" >Juglone concern</text><text x="235" y="200.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#262622" text-anchor="middle" >Can hold back the growth</text><text x="235" y="226.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#262622" text-anchor="middle" >of some plants</text><circle cx="110" cy="310" r="46" fill="#2e2119"/><circle cx="110" cy="310" r="39.6" fill="#6d4a2e"/><circle cx="110" cy="310" r="7.9" fill="none" stroke="#8c6239" stroke-width="1.1" opacity=".55"/><circle cx="110" cy="310" r="15.8" fill="none" stroke="#8c6239" stroke-width="1.1" opacity=".55"/><circle cx="110" cy="310" r="23.7" fill="none" stroke="#8c6239" stroke-width="1.1" opacity=".55"/><circle cx="110" cy="310" r="31.6" fill="none" stroke="#8c6239" stroke-width="1.1" opacity=".55"/><line x1="110" y1="310" x2="74.4" y2="319.5" stroke="#8c6239" stroke-width="1.6" opacity=".7"/><text x="180" y="320" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#262622" text-anchor="start" >Black walnut</text><circle cx="110" cy="440" r="46" fill="#5b4a3d"/><circle cx="110" cy="440" r="39.6" fill="#b58a5c"/><circle cx="110" cy="440" r="7.9" fill="none" stroke="#8c6239" stroke-width="1.1" opacity=".55"/><circle cx="110" cy="440" r="15.8" fill="none" stroke="#8c6239" stroke-width="1.1" opacity=".55"/><circle cx="110" cy="440" r="23.7" fill="none" stroke="#8c6239" stroke-width="1.1" opacity=".55"/><circle cx="110" cy="440" r="31.6" fill="none" stroke="#8c6239" stroke-width="1.1" opacity=".55"/><line x1="110" y1="440" x2="83.0" y2="465.0" stroke="#8c6239" stroke-width="1.6" opacity=".7"/><text x="180" y="450" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#262622" text-anchor="start" >Butternut</text><circle cx="110" cy="570" r="46" fill="#4c3a2c"/><circle cx="110" cy="570" r="39.6" fill="#a97d55"/><circle cx="110" cy="570" r="7.9" fill="none" stroke="#8c6239" stroke-width="1.1" opacity=".55"/><circle cx="110" cy="570" r="15.8" fill="none" stroke="#8c6239" stroke-width="1.1" opacity=".55"/><circle cx="110" cy="570" r="23.7" fill="none" stroke="#8c6239" stroke-width="1.1" opacity=".55"/><circle cx="110" cy="570" r="31.6" fill="none" stroke="#8c6239" stroke-width="1.1" opacity=".55"/><line x1="110" y1="570" x2="86.4" y2="541.7" stroke="#8c6239" stroke-width="1.6" opacity=".7"/><text x="180" y="580" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#262622" text-anchor="start" >Pecan</text><rect x="460" y="120" width="410" height="550" rx="20" fill="#e2eef6" stroke="#bfd6e6" stroke-width="2"/><text x="665" y="166" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#3f7aa6" text-anchor="middle" >Resists rotting</text><text x="665" y="200.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#262622" text-anchor="middle" >Breaks down so slowly it</text><text x="665" y="226.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#262622" text-anchor="middle" >doesn't feed the bed</text><circle cx="540" cy="310" r="46" fill="#6d3e28"/><circle cx="540" cy="310" r="39.6" fill="#c2744a"/><circle cx="540" cy="310" r="7.9" fill="none" stroke="#8c6239" stroke-width="1.1" opacity=".55"/><circle cx="540" cy="310" r="15.8" fill="none" stroke="#8c6239" stroke-width="1.1" opacity=".55"/><circle cx="540" cy="310" r="23.7" fill="none" stroke="#8c6239" stroke-width="1.1" opacity=".55"/><circle cx="540" cy="310" r="31.6" fill="none" stroke="#8c6239" stroke-width="1.1" opacity=".55"/><line x1="540" y1="310" x2="526.9" y2="344.4" stroke="#8c6239" stroke-width="1.6" opacity=".7"/><text x="610" y="320" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#262622" text-anchor="start" >Cedar</text><circle cx="540" cy="440" r="46" fill="#5a2d22"/><circle cx="540" cy="440" r="39.6" fill="#a8503a"/><circle cx="540" cy="440" r="7.9" fill="none" stroke="#8c6239" stroke-width="1.1" opacity=".55"/><circle cx="540" cy="440" r="15.8" fill="none" stroke="#8c6239" stroke-width="1.1" opacity=".55"/><circle cx="540" cy="440" r="23.7" fill="none" stroke="#8c6239" stroke-width="1.1" opacity=".55"/><circle cx="540" cy="440" r="31.6" fill="none" stroke="#8c6239" stroke-width="1.1" opacity=".55"/><line x1="540" y1="440" x2="503.2" y2="441.3" stroke="#8c6239" stroke-width="1.6" opacity=".7"/><text x="610" y="450" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#262622" text-anchor="start" >Redwood</text><circle cx="540" cy="570" r="46" fill="#4d4433"/><circle cx="540" cy="570" r="39.6" fill="#c9b25a"/><circle cx="540" cy="570" r="7.9" fill="none" stroke="#8c6239