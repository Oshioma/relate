<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img"><title>Key numbers from the video: a 4 by 8 foot bed, 30 inches tall, about 80 cubic feet</title><rect width="900" height="520" rx="0" fill="#faf9f5"/><text x="450" y="60" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#262622" text-anchor="middle" >The example bed in the video</text><rect x="30" y="90" width="410" height="150" rx="20" fill="#ffffff" stroke="#e7e3d8" stroke-width="2"/><text x="235" y="152" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#4d6a52" text-anchor="middle" >4 × 8 ft</text><text x="235" y="188" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#262622" text-anchor="middle" >30 in tall</text><text x="235" y="218" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#6b685f" text-anchor="middle" >1.2 × 2.4 m, 76 cm tall</text><rect x="460" y="90" width="410" height="150" rx="20" fill="#ffffff" stroke="#e7e3d8" stroke-width="2"/><text x="665" y="152" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#4d6a52" text-anchor="middle" >≈ 80 ft³</text><text x="665" y="188" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#262622" text-anchor="middle" >to fill</text><text x="665" y="218" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#6b685f" text-anchor="middle" >about 2.3 m³</text><rect x="30" y="260" width="410" height="150" rx="20" fill="#ffffff" stroke="#e7e3d8" stroke-width="2"/><text x="235" y="322" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#4d6a52" text-anchor="middle" >40–50 bags</text><text x="235" y="358" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#262622" text-anchor="middle" >of bagged soil</text><text x="235" y="388" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#6b685f" text-anchor="middle" >the presenter's count</text><rect x="460" y="260" width="410" height="150" rx="20" fill="#ffffff" stroke="#e7e3d8" stroke-width="2"/><text x="665" y="322" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#4d6a52" text-anchor="middle" >$400–1,000</text><text x="665" y="358" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#262622" text-anchor="middle" >in premium soil</text><text x="665" y="388" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#6b685f" text-anchor="middle" >his estimate, US prices</text><rect x="30" y="440" width="840" height="60" rx="14" fill="#e7ede7"/><text x="450" y="479" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#4d6a52" text-anchor="middle" >Presenter's estimate: up to about 60% less soil to buy</text></svg>